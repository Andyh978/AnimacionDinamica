<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Animación en Canvas</title>

    <style>
        canvas {
            border: 3px solid brown;
            background-color: white;
        }
    </style>

    <script>

        var x = 1;
        var dx = 2;

        function animate() {

            requestAnimationFrame(animate);

            var canvas = document.getElementById("micanvas");
            var context = canvas.getContext("2d");

            context.clearRect(0, 0, canvas.width, canvas.height);

            context.fillStyle = "yellow";

            // Punta superior
            context.fillRect(x + 450, 50, 100, 50);

            // Parte superior
            context.fillRect(x + 400, 100, 200, 50);

            // Parte media
            context.fillRect(x + 350, 150, 300, 50);

            // Brazos de la estrella
            context.fillRect(x + 300, 200, 400, 100);

            // Punta izquierda
            context.fillRect(x + 250, 200, 50, 50);

            // Punta derecha
            context.fillRect(x + 700, 200, 50, 50);

            // Parte inferior
            context.fillRect(x + 350, 300, 300, 50);

            // Punta inferior izquierda
            context.fillRect(x + 400, 350, 100, 50);
            context.fillRect(x + 400, 400, 50, 50);

            // Punta inferior derecha
            context.fillRect(x + 500, 350, 100, 50);
            context.fillRect(x + 550, 400, 50, 50);

            // Ojos
            context.fillStyle = "black";
            context.fillRect(x + 420, 200, 20, 50);
            context.fillRect(x + 560, 200, 20, 50);

            // Rebote
            if (x > 250 || x < -250) {
    dx = -dx;
}

            x += dx;

        }

        window.onload = animate;

    </script>

</head>

<body>

    <canvas id="micanvas" width="1000" height="600"></canvas>

</body>

</html>
