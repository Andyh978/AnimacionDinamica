<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Paint App</title>

  <style>

    body {
      text-align: center;
      margin: 0;
      padding: 25px;
      background-color: #e9edf2;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #202020;
      font-size: 32px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background-color: white;
      border: 2px solid #202020;
      border-radius: 8px;
    }


    /* COLORES */

    .colores {
      margin-top: 20px;
      text-align: center;
    }

    .colores button {
      width: 38px;
      height: 38px;
      margin: 0 5px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      cursor: pointer;
    }

    .colores button:hover {
      opacity: 0.6;
    }

    #black {
      background-color: black;
    }

    #red {
      background-color: #ff3b30;
    }

    #blue {
      background-color: #3478f6;
    }

    #green {
      background-color: #34c759;
    }

    #yellow {
      background-color: #ffcc00;
    }


    /* GROSORES */

    .grosores {
      margin-top: 15px;
      text-align: center;
    }

    .grosores button {
      width: 100px;
      height: 38px;
      margin: 0 4px;
      background-color: white;
      border: 1px solid #b8b8b8;
      border-radius: 20px;
      cursor: pointer;
    }

    .grosores button:hover {
      background-color: #dddddd;
    }

    .linea-delgada {
      display: block;
      width: 55px;
      height: 2px;
      margin: auto;
      background-color: black;
      pointer-events: none;
    }

    .linea-media {
      display: block;
      width: 55px;
      height: 6px;
      margin: auto;
      background-color: black;
      border-radius: 5px;
      pointer-events: none;
    }

    .linea-gruesa {
      display: block;
      width: 55px;
      height: 12px;
      margin: auto;
      background-color: black;
      border-radius: 6px;
      pointer-events: none;
    }


    /* BOTON BORRAR */

    #otros {
      margin-top: 15px;
    }

    #otros button {
      width: 180px;
      height: 40px;
      background-color: #202020;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
    }

    #otros button:hover {
      opacity: 0.7;
    }

    aside {
      margin-top: 10px;
      color: #555555;
      font-size: 14px;
    }

  </style>

</head>


<body>

  <h1>Paint App</h1>


  <!-- Canvas -->

  <canvas id="canvas" width="1000" height="700"></canvas>


  <!-- Colores -->

  <div class="colores">

    <button id="black" type="button" value="#000000"></button>

    <button id="red" type="button" value="#ff3b30"></button>

    <button id="blue" type="button" value="#3478f6"></button>

    <button id="green" type="button" value="#34c759"></button>

    <button id="yellow" type="button" value="#ffcc00"></button>

  </div>


  <!-- Grosores -->

  <div class="grosores">

    <button type="button" value="2">
      <span class="linea-delgada"></span>
    </button>

    <button type="button" value="6">
      <span class="linea-media"></span>
    </button>

    <button type="button" value="12">
      <span class="linea-gruesa"></span>
    </button>

  </div>


  <!-- Borrar -->

  <div id="otros">

    <button id="clear" type="button">Borrar todo</button>

  </div>


  <aside>Click and draw with the mouse.</aside>


  <!-- JavaScript -->

  <script src="utils.js"></script>

  <script>

    window.onload = function () {

      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas);


      // Dibujar

      canvas.addEventListener('mousedown', function () {

        context.beginPath();

        context.moveTo(mouse.x, mouse.y);

        canvas.addEventListener('mousemove', onMouseMove, false);

      }, false);


      canvas.addEventListener('mouseup', function () {

        canvas.removeEventListener('mousemove', onMouseMove, false);

      }, false);


      function onMouseMove () {

        context.lineTo(mouse.x, mouse.y);

        context.stroke();

      }


      // Cambiar color

      var colores = document.getElementsByClassName('colores')[0];

      colores.addEventListener('click', function(event) {

        context.strokeStyle = event.target.value;

      });


      // Cambiar grosor

      var grosores = document.getElementsByClassName('grosores')[0];

      grosores.addEventListener('click', function(event) {

        context.lineWidth = event.target.value;

      });


      // Borrar todo

      var clearButton = document.getElementById('clear');

      clearButton.addEventListener('click', function() {

        context.clearRect(0, 0, canvas.width, canvas.height);

      });

    };

  </script>

</body>

</html>
